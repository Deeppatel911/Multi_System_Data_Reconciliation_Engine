model_list:
  # Primary Model: Claude Sonnet 5 (Highest Priority)
  - model_name: mdm-resolver
    litellm_params:
      model: bedrock/anthropic.claude-sonnet-5
      aws_region_name: us-east-1
      order: 1

  # Fallback Model: Meta Llama 3.3 70B (Only triggers if order 1 fails)
  - model_name: mdm-resolver
    litellm_params:
      model: bedrock/us.meta.llama3-3-70b-instruct-v1:0
      aws_region_name: us-east-1
      order: 2

  # Cross-Family LLM-as-a-Judge: Mistral Large 3
  - model_name: mdm-judge
    litellm_params:
      model: bedrock/mistral.mistral-large-3-675b-instruct
      aws_region_name: us-east-1

router_settings:
  num_retries: 2
  timeout: 30

litellm_settings:
  drop_params: true
