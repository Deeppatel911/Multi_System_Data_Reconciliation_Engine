name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

# Required to exchange a GitHub token for an AWS IAM role token (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    name: Run Pytest Evaluation
    runs-on: ubuntu-latest
    env:
      LITELLM_BASE_URL: "http://localhost:4000"
      LITELLM_API_KEY: "sk-litellm-local"
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGGRAPH_DB_URL: ${{ secrets.LANGGRAPH_DB_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt

      - name: Start LiteLLM Proxy
        run: |
          pip install 'litellm[proxy]'
          litellm --config litellm_config.yaml &
          sleep 5 # Give the background proxy a few seconds to boot up

      - name: Run Pytest against Golden Dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest -s evals/

  deploy:
    name: Build and Deploy to ECS
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: arn:aws:iam::379151434681:role/GitHubActionsOIDCRole
            aws-region: us-east-1
            role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mdm-api-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force ECS Rolling Deployment
        run: |
          CLUSTER_ARN=$(aws ecs list-clusters --query "clusterArns[?contains(@, 'MdmEcsCluster')] | [0]" --output text)
          SERVICE_ARN=$(aws ecs list-services --cluster "$CLUSTER_ARN" --query "serviceArns[0]" --output text)
            
          echo "Discovered Cluster: $CLUSTER_ARN"
          echo "Discovered Service: $SERVICE_ARN"
            
          aws ecs update-service \
            --cluster "$CLUSTER_ARN" \
            --service "$SERVICE_ARN" \
            --force-new-deployment